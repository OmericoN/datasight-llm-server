apiVersion: apps/v1
kind: Deployment
metadata:
  name: datasight-vllm-gpu
  labels:
    app: datasight-vllm-gpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: datasight-vllm-gpu
  template:
    metadata:
      labels:
        app: datasight-vllm-gpu
    spec:
      containers:
        - name: vllm
          image: image-registry.openshift-image-registry.svc:5000/<project>/datasight-vllm-gpu:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8000"
            - name: VLLM_MODEL
              value: Qwen/Qwen2.5-32B-Instruct-AWQ
            - name: SERVED_MODEL_NAME
              value: Qwen/Qwen2.5-32B-Instruct-AWQ
            - name: VLLM_DTYPE
              value: auto
            - name: HF_HOME
              value: /hf-cache
            - name: HUGGINGFACE_HUB_CACHE
              value: /hf-cache/hub
            - name: TRANSFORMERS_CACHE
              value: /hf-cache/transformers
          volumeMounts:
            - name: hf-cache
              mountPath: /hf-cache
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
              nvidia.com/gpu: "1"
            limits:
              cpu: "64"
              memory: 256Gi
              nvidia.com/gpu: "1"
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: pvc-datasight-hf-cache
